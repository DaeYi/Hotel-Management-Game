version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Wait a week after a release so quick follow-up fixes arrive in one update.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node type definitions should match the Node 22 used to build and test.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major versions of the game engine, the UI library and the compiler need their own
      # planned upgrade and testing, so Dependabot offers only their minor and patch releases.
      - dependency-name: "phaser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
